[package]
name = "tensor4all-tcicore"
description = "TCI core infrastructure: matrix CI, cached function, index sets"
version.workspace = true
edition.workspace = true
authors = ["tensor4all contributors"]
license.workspace = true
repository.workspace = true

[features]
default = ["tenferro-cpu-faer"]
tenferro-cpu-faer = [
    "tensor4all-tensorbackend/tenferro-cpu-faer",
    "tenferro-einsum/cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-tensorbackend/tenferro-system-blas",
    "tenferro-einsum/cpu-blas",
]
tenferro-provider-inject = [
    "tensor4all-tensorbackend/tenferro-provider-inject",
    "tenferro-einsum/cpu-blas",
]

[dependencies]
num-complex.workspace = true
num-traits.workspace = true
anyhow.workspace = true
thiserror.workspace = true
paste.workspace = true
bnum.workspace = true
tenferro-einsum.workspace = true
tenferro-tensor.workspace = true
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tenferro-linalg.workspace = true
uint.workspace = true

[[bench]]
name = "rrlu_bench"
harness = false

[[bench]]
name = "cached_function"
harness = false

[[bench]]
name = "dense_vs_tenferro"
harness = false

[[bench]]
name = "lazy_block_rook"
harness = false
