[workspace]
members = [
    "crates/tensor4all-aci",
    "crates/tensor4all-tensorbackend",
    "crates/tensor4all-core",
    "crates/tensor4all-treetn",
    "crates/tensor4all-itensorlike",
    "crates/tensor4all-quanticstransform",
    "crates/tensor4all-simplett",
    "crates/tensor4all-partitionedtt",
    "crates/tensor4all-partitionedtreetn",
    "crates/tensor4all-tensorci",
    "crates/tensor4all-quanticstci",
    "crates/tensor4all-interpolativeqtt",
    "crates/tensor4all-treetci",
    "crates/tensor4all-capi",
    "crates/tensor4all-hdf5",
    "tools/api-dump",
    "tools/library-panic-audit",
    "xtask",
    "docs/book-tests",
    "docs/tutorial-code",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["tensor4all collaboration"]
license = "MIT"
repository = "https://github.com/tensor4all/tensor4all-rs"

# Keep ordinary local profiles free of debug info (shared rule: build-artifact
# hygiene). For Rust source-level C API diagnostics or debugger sessions, build
# with --profile release-debug. One-command dev/test overrides remain available
# through CARGO_PROFILE_DEV_DEBUG=2 / CARGO_PROFILE_TEST_DEBUG=2.
[profile.dev]
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test]
debug = 0
debug-assertions = true
overflow-checks = true

[profile.release]
debug = 0

[profile.release-debug]
inherits = "release"
debug = true

# Comprehensive CI keeps release-mode semantics while avoiding artifacts that
# are not reused after the job and symbols that are not needed to run checks.
[profile.ci]
inherits = "release"
incremental = false
strip = "symbols"

[workspace.dependencies]
num-complex = "0.4"
num-traits = "0.2"
anyhow = "1.0"
approx = "0.5"
serde_json = "1"
criterion = "0.5"
bnum = "0.12"
uint = "0.10"
libc = "0.2"
paste = "1.0"
smallvec = "1.15"
thiserror = "2.0"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
petgraph = "0.7"
dyn-clone = "1.0"
omeco = "0.2.1"
hdf5-metno = { version = "0.12", default-features = false }
ndarray = "0.17"
quanticsgrids = { git = "https://github.com/tensor4all/quanticsgrids-rs", rev = "8214b72" }
hdf5-rt = { git = "https://github.com/tensor4all/hdf5-rt", default-features = false }
tenferro = { package = "tenferro-runtime", git = "https://github.com/tensor4all/tenferro-rs.git", rev = "b5a106be3133979d78832a0ca3f4d6b57613b3d7", default-features = false }
tenferro-ad = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "b5a106be3133979d78832a0ca3f4d6b57613b3d7", default-features = false }
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "b5a106be3133979d78832a0ca3f4d6b57613b3d7", default-features = false }
tenferro-einsum = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "b5a106be3133979d78832a0ca3f4d6b57613b3d7", default-features = false }
tenferro-linalg = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "b5a106be3133979d78832a0ca3f4d6b57613b3d7", default-features = false }
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "b5a106be3133979d78832a0ca3f4d6b57613b3d7", default-features = false }
