name: CI_rs

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # The public-error-doc backlog is burned down; error/panic doc
        # requirements are now repository-wide blocking (issue #566 PR3).
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc

  doctest:
    name: Doctests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Run rustdoc tests
        run: cargo test --doc --profile ci --workspace -j 8

      - name: Run mdBook tests
        run: TENSOR4ALL_CARGO_PROFILE=ci ./scripts/test-mdbook.sh

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d target ]]; then
            du -sh target
          else
            echo "target directory was not created"
          fi

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      # tensor4all-hdf5 is kept out of nextest because its dlopen-based tests
      # fail under nextest's per-process execution model.
      - name: Run tests (non-HDF5)
        run: cargo nextest run --cargo-profile ci --workspace --exclude tensor4all-hdf5

      - name: Run HDF5 tests
        run: cargo test --profile ci -p tensor4all-hdf5

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d target ]]; then
            du -sh target
          else
            echo "target directory was not created"
          fi

  scripts:
    name: Maintenance scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.2 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Check generated C API header
        run: ./scripts/check-capi-header.sh

      - name: Test the repository-rules review script
        run: python3 scripts/test-repository-rules-review.py

      - name: Test library panic audit
        run: python3 scripts/test-audit-library-panics.py

      - name: Audit library panic paths
        # Clippy passes: 10m each; Rust tool: 25m; wrapper build+audit: 35m; CI: 40m.
        timeout-minutes: 40
        run: python3 scripts/audit-library-panics.py

      - name: Test public-error-doc audit
        run: python3 scripts/test-check-public-error-docs.py

      - name: Audit public Result APIs (repository-wide blocking)
        # Repository-wide blocking: the pre-existing backlog is zero.
        run: python3 scripts/check-public-error-docs.py

      - name: Test crate-boundary checker
        run: python3 scripts/test-check-crate-boundaries.py

      - name: Check crate boundaries and dev cycles
        run: python3 scripts/check-crate-boundaries.py

      - name: Test coverage threshold checker
        run: python3 scripts/test-check-coverage.py

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4

      # book-tests depends on tensor4all-hdf5, so --exclude tensor4all-hdf5
      # still builds the HDF5 stack; the dev package is required for that.
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Generate release coverage JSON
        # Release-mode measurement: the repository's normal verification mode.
        run: cargo llvm-cov --release --workspace --exclude tensor4all-hdf5 --json --output-path coverage.json

      - name: Check per-file thresholds
        run: python3 scripts/check-coverage.py coverage.json

  rollup-rs:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - coverage
      - doctest
      - scripts
    if: always()
    steps:
      - name: All Rust checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Some Rust checks failed or cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
