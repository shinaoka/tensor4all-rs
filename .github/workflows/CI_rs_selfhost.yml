name: CI_rs_selfhost

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # fork からの PR: GitHub-hosted runner で通常 CI
  ci-fork:
    name: CI (fork PR / github-hosted)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      # tensor4all-hdf5 is kept out of nextest because its dlopen-based tests
      # fail under nextest's per-process execution model.
      - name: Run tests (non-HDF5)
        run: cargo nextest run --cargo-profile ci --workspace --exclude tensor4all-hdf5

      - name: Run HDF5 tests
        run: cargo test --profile ci -p tensor4all-hdf5

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d target ]]; then
            du -sh target
          else
            echo "target directory was not created"
          fi

  # PRs from the same repository: run heavy CI on self-hosted runner
  ci-maintainer:
    name: CI (same-repo PR / self-hosted heavy)
    if: github.event.pull_request.head.repo.full_name == github.repository
    # runs-on: [self-hosted, linux, x64] # self-host-runner
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Note: Disable this step when runs-on is self-hosted
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      # 必要に応じてセットアップを追加
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - name: Run tests (non-HDF5)
        run: cargo nextest run --cargo-profile ci --workspace --exclude tensor4all-hdf5

      - name: Run HDF5 tests
        run: cargo test --profile ci -p tensor4all-hdf5

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d "$CARGO_TARGET_DIR" ]]; then
            du -sh "$CARGO_TARGET_DIR"
          else
            echo "target directory was not created"
          fi
